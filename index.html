async function apply(items,inv,desc,rec){

  for(let i=0;i<items.length;i+=40){
   const ch=items.slice(i,i+40),ct=new AbortController(),tt=setTimeout(()=>ct.abort(),45000);
   let j;try{j=await(await fetch(API,{method:'POST',body:JSON.stringify({key:KEY,user:USER,action:'batch',items:ch}),signal:ct.signal})).json()}finally{clearTimeout(tt)}
   if(!j||j.error)throw new Error(j?j.error:'sin respuesta');fall=fall.concat(j.fallos||[]);
  }
 }catch(e){alert('No se pudo guardar ('+(e.name==='AbortError'?'Google tardó demasiado':e.message)+'). Nada se perdió; puedes reintentar.');return false}
 const bad=new Set(fall),byId={};ROWS.forEach(r=>byId[r.ID]=r);
 items.forEach(it=>{if(bad.has(it.id))return;const r=byId[it.id];if(!r)return;Object.keys(it.set).forEach(k=>{r[k]=it.set[k]});r._del=String(r.ELIMINADA)==='1'});

 DONE+=good.length;if(rec!==false)UND.push({inv:ginv,desc,t:new Date(),n:good.length});detect();if(!$('#hs').hidden)hist();
 toast(fall.length?'✓ '+good.length+' guardadas · '+fall.length+' no se pudieron aplicar':'✓ '+desc,true);return true;
}
